name: Vyonetix Dependency Evidence Check
description: Query Vyonetix Developer Risk Signals for OSV advisory IDs from a CycloneDX SBOM
author: Vyonetix Solutions
inputs:
  sbom-path:
    description: Path to a CycloneDX JSON SBOM generated by the caller's workflow
    required: true
  rapidapi-host:
    description: API host copied from the Vyonetix RapidAPI listing
    required: true
  rapidapi-key:
    description: RapidAPI consumer key; pass from a repository secret
    required: true
  check-malicious:
    description: Also request exact OpenSSF MAL report matches (one additional API call)
    required: false
    default: "false"
  fail-on-findings:
    description: Fail this job after writing the summary when source records match
    required: false
    default: "false"
outputs:
  package_count:
    description: Number of supported unique package/version tuples submitted
    value: ${{ steps.risk_check.outputs.package_count }}
  advisory_package_count:
    description: Number of package tuples with OSV advisory matches
    value: ${{ steps.risk_check.outputs.advisory_package_count }}
  advisory_count:
    description: Number of OSV advisory identifiers returned
    value: ${{ steps.risk_check.outputs.advisory_count }}
  malicious_package_count:
    description: Number of packages with exact OpenSSF MAL report matches
    value: ${{ steps.risk_check.outputs.malicious_package_count }}
runs:
  using: composite
  steps:
    - id: risk_check
      name: Query Vyonetix Developer Risk Signals
      shell: bash
      env:
        SBOM_PATH: ${{ inputs.sbom-path }}
        RAPIDAPI_HOST: ${{ inputs.rapidapi-host }}
        RAPIDAPI_KEY: ${{ inputs.rapidapi-key }}
        CHECK_MALICIOUS: ${{ inputs.check-malicious }}
        FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
      run: python3 "${GITHUB_ACTION_PATH}/main.py"
